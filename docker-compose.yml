version: "3.9"

# ─── PulseGraph Local Infrastructure ────────────────────────────────────────
# Ports summary:
#   Redpanda broker:      9092  (Kafka)
#   Redpanda admin:       9644  (Admin API)
#   Redpanda Console:     8080
#   ClickHouse HTTP:      8123
#   ClickHouse native:    9000
#   OpenSearch:           9200
#   OpenSearch dashboards: 5601
#   MinIO API:            9001
#   MinIO Console:        9090
#   Postgres:             5432

volumes:
  redpanda_data:
  clickhouse_data:
  opensearch_data:
  minio_data:
  postgres_data:

networks:
  pulsegraph:
    driver: bridge

services:

  # ── Redpanda (Kafka-compatible streaming) ──────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v23.3.11
    container_name: pulsegraph-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"    # Kafka (external)
      - "9644:9644"    # Admin API
      - "8082:8082"    # Pandaproxy (HTTP)
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - pulsegraph
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.4.5
    container_name: pulsegraph-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "redpanda:29092"
    ports:
      - "8080:8080"
    networks:
      - pulsegraph

  # ── ClickHouse (time-series metrics & spans) ───────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulsegraph-clickhouse
    environment:
      CLICKHOUSE_DB: pulsegraph
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-pulsegraph}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-pulsegraph}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - pulsegraph
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ── OpenSearch (topology graph & log search) ───────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: pulsegraph-opensearch
    environment:
      cluster.name: pulsegraph-cluster
      node.name: opensearch-node1
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"   # dev only
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # REST API
      - "9600:9600"   # Performance Analyzer
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - pulsegraph
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 12

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: pulsegraph-opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    networks:
      - pulsegraph

  # ── MinIO (snapshot blobs & model artefacts) ───────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    container_name: pulsegraph-minio
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulsegraph}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pulsegraph123}
    ports:
      - "9001:9000"   # S3 API
      - "9090:9090"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - pulsegraph
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Postgres (config, metadata, user state) ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pulsegraph-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsegraph}
      POSTGRES_USER: ${POSTGRES_USER:-pulsegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsegraph}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulsegraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsegraph}"]
      interval: 10s
      timeout: 5s
      retries: 10
